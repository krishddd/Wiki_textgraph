name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync (core + dev)
        run: uv sync --extra dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
