name: benchmark

# Manual / nightly only — NOT a required PR check. Runs the evaluation harness
# against pinned fixture corpora and publishes a diffable report so extraction /
# retrieval regressions are caught before release. Real benchmarks land in Phase 4.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC nightly

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync (core + dev)
        run: uv sync --extra dev
      - name: Run benchmark harness
        run: uv run python -m benchmarks.run --report benchmarks/latest-report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/latest-report.md
