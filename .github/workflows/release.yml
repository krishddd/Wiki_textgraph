name: release

# Builds and publishes on tag. Critically, re-runs the determinism test against
# the exact released artifact before publishing (G1).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync (core + dev)
        run: uv sync --extra dev
      - name: Full test suite
        run: uv run pytest -q
      - name: Determinism gate on released state
        run: uv run pytest tests/determinism -q
      - name: Build distribution
        run: uv build
      - name: Verify built wheel is importable and deterministic
        shell: bash
        run: |
          uv run --no-project --with dist/*.whl textgraph build tests/fixtures/corpus_docs -o /tmp/rel-a.json
          uv run --no-project --with dist/*.whl textgraph build tests/fixtures/corpus_docs -o /tmp/rel-b.json
          cmp -s /tmp/rel-a.json /tmp/rel-b.json || { echo "::error::released artifact is non-deterministic"; exit 1; }
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
