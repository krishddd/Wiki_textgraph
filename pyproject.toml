[project]
name = "textgraph-kg"
version = "3.6.0"
description = "Turn any textual corpus into a queryable, byte-cited knowledge graph. Deterministic & local-first by default, with opt-in LLM extraction, grounded answer synthesis, and semantic (embedding) search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "krishddd" }]
keywords = ["knowledge-graph", "provenance", "information-extraction", "mcp", "deterministic", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # Lean core: content addressing + pure-Python structural parsers.
    # Everything heavy (Docling, tree-sitter, encoder models) lives behind extras.
    "blake3>=0.4.1",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0",
    # PDF text ingestion in the DEFAULT install — investigators live in PDFs, and pypdf is
    # pure-Python, BSD-3 licensed, small, and deterministic (no binary deps, no GPU). Layout/
    # OCR fidelity (Docling) stays opt-in in [ingest]; the default extracts the text layer.
    "pypdf>=4.0.0",
]

[project.urls]
Homepage = "https://krishddd.github.io/Wiki_textgraph/"
Repository = "https://github.com/krishddd/Wiki_textgraph"
Documentation = "https://github.com/krishddd/Wiki_textgraph/blob/main/docs/RUNNING.md"
Changelog = "https://github.com/krishddd/Wiki_textgraph/blob/main/CHANGELOG.md"
"Live demo" = "https://krishddd.github.io/Wiki_textgraph/"
"Bug Tracker" = "https://github.com/krishddd/Wiki_textgraph/issues"

[project.optional-dependencies]
# Higher-fidelity rich-document ingestion. Docling adds layout/table/OCR; tree-sitter/Drain3
# give deterministic structured-text/log parsing. (PDF text works without this — see core.)
ingest = [
    "docling>=2.0.0",
    "tree-sitter>=0.21.0",
    "drain3>=0.9.11",
]
# Linguistic substrate + encoder IE (Phase 2)
ie = ["spacy>=3.7.0", "gliner>=0.2.0", "fastcoref>=2.1.6"]
# Entity resolution (Phase 3)
er = ["splink>=4.0.0", "duckdb>=1.0.0"]
# Analytics + storage backend (Phase 4)
graph = ["networkx>=3.2", "leidenalg>=0.10.0", "python-igraph>=0.11.0", "duckdb>=1.0.0", "pyarrow>=15.0.0"]
# Optional backends / surfaces
neo4j = ["neo4j>=5.0.0"]
mcp = ["mcp>=1.0.0"]
# Cross-encoder reranker for L8 hybrid search (import-guarded; builtin is the default).
rerank = ["sentence-transformers>=3.0.0"]
# Local dense embeddings for semantic retrieval (the `st` embed backend). The `openai`
# backend needs no extra — it speaks the OpenAI-compatible /embeddings API over stdlib.
embed = ["sentence-transformers>=3.0.0"]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
vision = ["colpali-engine>=0.3.0"]
security = ["openfga-sdk>=0.5.0"]
# Framework adapters — consume the graph from LangChain / LlamaIndex, citations preserved.
langchain = ["langchain-core>=0.3.0"]
llamaindex = ["llama-index-core>=0.11.0"]
# Everything the core product needs (Phases 1-6)
full = [
    "textgraph-kg[ingest,ie,er,graph,mcp]",
]
# Development toolchain
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "jsonschema>=4.20.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
textgraph = "textgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["textgraph", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# graph_html.py embeds a self-contained HTML/JS template; long template lines are
# intentional and not real code lines.
"textgraph/l9_artifacts/graph_html.py" = ["E501"]
# These embed self-contained HTML/JS (inline styles + JS templates); long template
# lines are intentional, not real code lines.
"textgraph/console/page.py" = ["E501"]
"textgraph/console/renderer.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# Strict typing is enforced on the foundation + Phase-1 layers; ratcheted up per phase.
files = [
    "textgraph/core",
    "textgraph/store",
    "textgraph/console",
    "textgraph/gql",
    "textgraph/got",
    "textgraph/integrations",
    "textgraph/mcp",
    "textgraph/l0_ingest",
    "textgraph/l1_structure",
    "textgraph/l2_linguistic",
    "textgraph/l3_encoder_ie",
    "textgraph/l4_llm_optional",
    "textgraph/l5_entity_resolution",
    "textgraph/l6_graph_model",
    "textgraph/l7_analytics",
    "textgraph/l8_retrieval",
    "textgraph/l9_artifacts",
    "textgraph/security",
    "textgraph/pipeline.py",
    "textgraph/doctor.py",
]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "blake3.*", "yaml.*", "markdown_it.*", "pypdf.*", "gliner.*", "splink.*", "mcp.*",
    "igraph.*", "leidenalg.*", "duckdb.*", "sentence_transformers.*", "colpali_engine.*",
    "openfga_sdk.*", "langchain_core.*", "llama_index.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
# Gate the whole package, not just core/. Omit modules that only execute when their
# optional extra is installed (import-guarded backends) or that bind a socket — the CI
# env is lean-by-design, so those run in dedicated/extra jobs, not the default gate.
source = ["textgraph"]
branch = true
omit = [
    "textgraph/console/server.py",
    "textgraph/mcp/server.py",
    "textgraph/store/duckdb_store.py",
    "textgraph/l3_encoder_ie/gliner_backend.py",
    "textgraph/l5_entity_resolution/splink_backend.py",
]

[tool.coverage.report]
# Whole-package floor (was 80% on core/ only through Phase 0). Ratcheted up as the
# layers landed; current actual is ~92% over the gated modules.
fail_under = 88
show_missing = true
