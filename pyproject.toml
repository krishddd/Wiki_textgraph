[project]
name = "textgraph"
version = "0.0.1"
description = "Turn any textual corpus into a queryable knowledge graph with byte-level provenance on every claim. Local-first, deterministic, zero-LLM-by-default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krishddd" }]
keywords = ["knowledge-graph", "provenance", "information-extraction", "mcp", "deterministic", "rag"]
dependencies = [
    # Lean core: content addressing + pure-Python structural parsers only.
    # Everything heavy (Docling, tree-sitter, encoder models) lives behind extras.
    "blake3>=0.4.1",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Rich-document ingestion. PDF text needs pypdf; Docling adds layout/table/OCR
# fidelity; tree-sitter/Drain3 give deterministic structured-text/log parsing.
ingest = [
    "pypdf>=4.0.0",
    "docling>=2.0.0",
    "tree-sitter>=0.21.0",
    "drain3>=0.9.11",
]
# Linguistic substrate + encoder IE (Phase 2)
ie = ["spacy>=3.7.0", "gliner>=0.2.0", "fastcoref>=2.1.6"]
# Entity resolution (Phase 3)
er = ["splink>=4.0.0", "duckdb>=1.0.0"]
# Analytics + storage backend (Phase 4)
graph = ["networkx>=3.2", "leidenalg>=0.10.0", "python-igraph>=0.11.0", "duckdb>=1.0.0", "pyarrow>=15.0.0"]
# Optional backends / surfaces
neo4j = ["neo4j>=5.0.0"]
mcp = ["mcp>=1.0.0"]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
vision = ["colpali-engine>=0.3.0"]
security = ["openfga-sdk>=0.5.0"]
# Everything the core product needs (Phases 1-6)
full = [
    "textgraph[ingest,ie,er,graph,mcp]",
]
# Development toolchain
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "jsonschema>=4.20.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
textgraph = "textgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["textgraph", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# graph_html.py embeds a self-contained HTML/JS template; long template lines are
# intentional and not real code lines.
"textgraph/l9_artifacts/graph_html.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# Strict typing is enforced on the foundation + Phase-1 layers; ratcheted up per phase.
files = [
    "textgraph/core",
    "textgraph/store",
    "textgraph/mcp",
    "textgraph/l0_ingest",
    "textgraph/l1_structure",
    "textgraph/l2_linguistic",
    "textgraph/l3_encoder_ie",
    "textgraph/l5_entity_resolution",
    "textgraph/l6_graph_model",
    "textgraph/l7_analytics",
    "textgraph/l8_retrieval",
    "textgraph/l9_artifacts",
    "textgraph/pipeline.py",
]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "blake3.*", "yaml.*", "markdown_it.*", "pypdf.*", "gliner.*", "splink.*", "mcp.*",
    "igraph.*", "leidenalg.*", "duckdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["textgraph/core"]
branch = true

[tool.coverage.report]
# Phase 0 gate: 80%+ on core/, ratcheted upward per phase.
fail_under = 80
show_missing = true
