[project]
name = "textgraph"
version = "0.0.1"
description = "Turn any textual corpus into a queryable knowledge graph with byte-level provenance on every claim. Local-first, deterministic, zero-LLM-by-default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krishddd" }]
keywords = ["knowledge-graph", "provenance", "information-extraction", "mcp", "deterministic", "rag"]
dependencies = [
    # Lean core: content addressing only. Everything heavy lives behind extras.
    "blake3>=0.4.1",
]

[project.optional-dependencies]
# Structural spine + rich-doc ingestion (Phase 1)
ingest = ["docling>=2.0.0", "tree-sitter>=0.21.0", "drain3>=0.9.11"]
# Linguistic substrate + encoder IE (Phase 2)
ie = ["spacy>=3.7.0", "gliner>=0.2.0", "fastcoref>=2.1.6"]
# Entity resolution (Phase 3)
er = ["splink>=4.0.0", "duckdb>=1.0.0"]
# Analytics + storage backend (Phase 4)
graph = ["networkx>=3.2", "leidenalg>=0.10.0", "python-igraph>=0.11.0", "duckdb>=1.0.0", "pyarrow>=15.0.0"]
# Optional backends / surfaces
neo4j = ["neo4j>=5.0.0"]
mcp = ["mcp>=1.0.0"]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
vision = ["colpali-engine>=0.3.0"]
security = ["openfga-sdk>=0.5.0"]
# Everything the core product needs (Phases 1-6)
full = [
    "textgraph[ingest,ie,er,graph,mcp]",
]
# Development toolchain
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[project.scripts]
textgraph = "textgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["textgraph", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
# Strict typing is enforced on the foundation modules first; the rest is ratcheted up per phase.
files = ["textgraph/core", "textgraph/store", "textgraph/mcp"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["blake3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["textgraph/core"]
branch = true

[tool.coverage.report]
# Phase 0 gate: 80%+ on core/, ratcheted upward per phase.
fail_under = 80
show_missing = true
